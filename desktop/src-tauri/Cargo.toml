[package]
name = "fusion_bambu_desktop"
version = "0.1.2"
edition = "2021"
description = "FusionBambu3mf desktop"

[lib]
name = "fusion_bambu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
