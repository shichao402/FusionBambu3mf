name: release

on:
  workflow_dispatch:
  push:
    tags: [dev, stable]

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            arch: ""
          - os: macos-14
            label: macos-arm64
            arch: aarch64-apple-darwin
          - os: macos-13
            label: macos-x64
            arch: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: node scripts/ci.mjs
        env:
          CI_TASK: package
          CI_TARGET_ARCH: ${{ matrix.arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/tags/dev' || github.ref == 'refs/tags/stable'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/release
          merge-multiple: true
      - run: ls -l dist/release
      - run: node scripts/ci.mjs
        env:
          CI_TASK: publish
          GH_TOKEN: ${{ github.token }}
